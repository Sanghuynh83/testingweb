# [[Phân biệt Copywriting và Content Writing]]

## 1. Định nghĩa

**Copywriting** và **Content Writing** (Viết Nội dung) là hai kỹ năng cốt lõi trong marketing, nhưng chúng có mục tiêu và cách tiếp cận *khác nhau*.

* **Copywriting (Viết Quảng cáo):** Thúc đẩy *hành động* (Action).
* **Content Writing (Viết Nội dung):** Xây dựng *sự gắn kết & lòng tin* (Engagement & Trust).

Một cách ví von:
* **Content Writing (Marketing Hút):** Là [[Inbound Marketing]]. Bạn tạo ra một nhà hàng (blog, video) có không khí tuyệt vời, đồ ăn ngon (giá trị), thu hút khách hàng *tự tìm đến*.
* **Copywriting (Marketing Thúc đẩy):** Là người phục vụ (salesperson) đến bàn và nói: "Món đặc biệt hôm nay của chúng tôi là [Sản phẩm], anh chị có muốn dùng thử không?".

## 3. Mối quan hệ
Copywriting và Content Writing không phải là đối thủ, chúng là **đồng đội**.
* [[Content Marketing là gì|Content Marketing]] (Content Writing) thu hút và làm ấm (warm up) khách hàng tiềm năng.
* [[Copywriting là gì|Copywriting]] chuyển đổi (convert) những khách hàng tiềm năng đó thành khách hàng trả tiền.

        // -- HÀM XỬ LÝ API VỚI EXPONENTIAL BACKOFF --
        async function fetchWithBackoff(url, options, retries = 3, delay = 1000) {
            try {
                const response = await fetch(url, options);
                if (!response.ok) {
                    // Log lỗi không phải 429 (rate limit) để gỡ lỗi
                    if (response.status !== 429 && retries > 0) {
                        console.warn(`Lỗi API (không phải 429): ${response.status}`, await response.text());
                    }
                    
                    if (response.status === 429 && retries > 0) {
                        // Đây là retry backoff, không cần log ra console
                        await new Promise(resolve => setTimeout(resolve, delay));
                        return fetchWithBackoff(url, options, retries - 1, delay * 2);
                    }
                    throw new Error(`Lỗi API: ${response.status} ${response.statusText}`);
                }
                return response.json();
            } catch (error) { 
                // Chỉ log lỗi cuối cùng, không phải các lần retry
                if (retries === 0) {
                    console.error("Lỗi fetch sau khi đã thử lại:", error); 
                }
                throw error; 
            }
        }

        // -- HÀM GỌI AI ĐỂ TẠO QUIZ --
        async function generateQuiz() {
            if (!selectedLevel) return;
            setLoading(true);
            errorMessage.textContent = '';
            
            const levelDescriptions = {
                "Biết": "Cấp độ 'Biết': Các câu hỏi tập trung vào việc nhớ lại thông tin, định nghĩa, và sự kiện đã nêu. (Ví dụ: 'Copywriting là gì?', 'Mục tiêu chính của Content Writing là gì?').",
                "Hiểu": "Cấp độ 'Hiểu': Các câu hỏi tập trung vào việc giải thích, so sánh, và diễn giải ý nghĩa. (Ví dụ: 'Sự khác biệt chính giữa Copywriting và Content Writing là gì?', 'Tại sao Content Writing lại quan trọng cho TOFU?').",
                "Ứng dụng": "Cấp độ 'Ứng dụng': Các câu hỏi tập trung vào việc áp dụng kiến thức vào một tình huống mới hoặc ví dụ cụ thể. (Ví dụ: 'Một Landing Page được coi là ví dụ của loại hình viết nào?', 'Để xây dựng lòng tin, bạn nên dùng...')."
            };
            const levelDescription = levelDescriptions[selectedLevel];
            const systemPrompt = "Bạn là một trợ lý giáo dục, chuyên tạo ra 10 câu hỏi trắc nghiệm phức tạp và sâu sắc để kiểm tra hiểu biết. Đảm bảo đáp án đúng phải nằm trong danh sách 4 lựa chọn.";
            const userQuery = `Dựa trên văn bản sau đây, hãy tạo chính xác 10 câu hỏi trắc nghiệm.
Tất cả 10 câu hỏi PHẢI tuân theo cấp độ nhận thức sau: ${levelDescription}
Văn bản:
${CONTEXT_TEXT}`;

            const payload = {
                contents: [{ parts: [{ text: userQuery }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] },
                generationConfig: {
                    responseMimeType: "application/json", 
                    responseSchema: JSON_SCHEMA,
                    temperature: 0.7 
                }
            };

            try {
                const result = await fetchWithBackoff(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (result.candidates && result.candidates[0].content && result.candidates[0].content.parts[0].text) {
                    const jsonText = result.candidates[0].content.parts[0].text;
                    quizData = JSON.parse(jsonText); 
                    // Lọc kỹ hơn: đảm bảo câu hỏi, lựa chọn và câu trả lời đều tồn tại VÀ câu trả lời nằm trong các lựa chọn
                    quizData = quizData.filter(q => 
                        q.question && 
                        q.options && Array.isArray(q.options) && q.options.length === 4 && 
                        q.answer && 
                        q.options.includes(q.answer)
                    );
                    
                    if (quizData.length < 5) { // Cần ít nhất 5 câu hỏi hợp lệ
                        console.warn("AI trả về không đủ câu hỏi hợp lệ:", quizData);
                        throw new Error("AI không tạo đủ câu hỏi hợp lệ.");
                    }
                    
                    startQuizAnimation();
                } else {
                    console.error("Phản hồi từ AI không hợp lệ hoặc thiếu nội dung:", result);
                    throw new Error("Phản hồi từ AI không hợp lệ.");
                }

            } catch (error) {
                console.error("Không thể tạo quiz:", error); 
                errorMessage.textContent = "Không thể tạo câu hỏi. Vui lòng thử lại.";
            } finally {
                setLoading(false);
            }
        }

        // -- HÀM XỬ LÝ TRẠNG THÁI LOADING --
        function setLoading(isLoading) {
            if (isLoading) {
                generateBtn.disabled = true;
                loadingSpinner.style.display = 'inline-block';
                generateBtnText.textContent = 'AI đang tạo câu hỏi...';
                levelTabs.forEach(tab => tab.disabled = true);
            } else {
                // Chỉ bật nút nếu một cấp độ đã được chọn
                generateBtn.disabled = !selectedLevel; 
                loadingSpinner.style.display = 'none';
                generateBtnText.textContent = selectedLevel ? `Tạo 10 câu hỏi (Cấp độ: ${selectedLevel})` : 'Chọn cấp độ để bắt đầu';
                levelTabs.forEach(tab => tab.disabled = false);
            }
        }

        // -- CÁC HÀM QUẢN LÝ ANIMATION VÀ QUIZ --

        function startQuizAnimation() {
            anchorText.textContent = `Cấp độ: ${selectedLevel}`;
            // Đảm bảo anchorBox hiển thị
            anchorBox.style.opacity = 1;
            anchorBox.style.transform = 'scale(1)';
            anchorBox.style.pointerEvents = 'auto';

            // Ẩn generator
            generatorContainer.style.opacity = 0;
            generatorContainer.style.transform = 'scale(0.95)';
            generatorContainer.style.pointerEvents = 'none';

            setTimeout(() => {
                // Hiện quiz
                quizContainer.style.opacity = 1;
                quizContainer.style.transform = 'scale(1)';
                quizContainer.style.pointerEvents = 'auto';
                startQuiz(); // Hàm này sẽ gọi showQuestion()
            }, 300); 
        }

        function startQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            answerSelected = false;
            showQuestion();
        }

        function showQuestion() {
            resetState();
            const question = quizData[currentQuestionIndex];
            questionText.textContent = question.question;
            questionCounter.textContent = `Câu ${currentQuestionIndex + 1} / ${quizData.length}`;

            // Xáo trộn các lựa chọn một cách đáng tin cậy
            const shuffledOptions = [...question.options].sort(() => Math.random() - 0.5);

            shuffledOptions.forEach(option => {
                const button = document.createElement('button');
                button.textContent = option;
                button.classList.add('option-btn', 'w-full', 'p-4', 'text-left', 'bg-white', 'border-2', 'border-gray-200', 'rounded-lg', 'text-gray-900', 'transition-all', 'duration-200', 'font-medium');
                button.addEventListener('click', () => selectAnswer(button, option, question.answer));
                optionsContainer.appendChild(button);
            });

            // Điều chỉnh chiều cao sau khi câu hỏi mới được hiển thị
            adjustCardHeight(quizContainer);
        }

        function resetState() {
            optionsContainer.innerHTML = '';
            nextBtn.style.display = 'none';
            feedbackText.textContent = '';
            answerSelected = false;
        }

        function selectAnswer(selectedButton, selectedOption, correctAnswer) {
            if (answerSelected) return;
            answerSelected = true;

            Array.from(optionsContainer.children).forEach(btn => {
                btn.disabled = true;
                if (btn.textContent === correctAnswer) {
                    btn.classList.add('correct');
                }
            });

            if (selectedOption === correctAnswer) {
                score++;
                feedbackText.textContent = 'Chính xác!';
                feedbackText.style.color = '#111827'; // gray-900
            } else {
                feedbackText.textContent = `Sai rồi!`;
                feedbackText.style.color = '#6b7280'; // gray-500
                selectedButton.classList.add('incorrect');
            }

            if (currentQuestionIndex < quizData.length - 1) {
                nextBtn.textContent = 'Câu tiếp theo';
            } else {
                nextBtn.textContent = 'Xem kết quả';
            }
            nextBtn.style.display = 'block';

            // Điều chỉnh chiều cao sau khi nút "Next" và feedback xuất hiện
            adjustCardHeight(quizContainer);
        }

        function showResultsAnimation() {
            // Ẩn quiz
            quizContainer.style.opacity = 0;
            quizContainer.style.transform = 'scale(0.95)';
            quizContainer.style.pointerEvents = 'none';
            
            setTimeout(() => {
                // Hiện kết quả
                resultsContainer.style.opacity = 1;
                resultsContainer.style.transform = 'scale(1)';
                resultsContainer.style.pointerEvents = 'auto';
                scoreText.textContent = `${score} / ${quizData.length}`;
                adjustCardHeight(resultsContainer);
            }, 300);
        }

        // -- THÊM CÁC EVENT LISTENER --
        
        levelTabs.forEach(tab => {
            tab.addEventListener('click', () => {
                levelTabs.forEach(t => t.classList.remove('active-tab'));
                tab.classList.add('active-tab');
                selectedLevel = tab.dataset.level;
                generateBtn.disabled = false;
                generateBtnText.textContent = `Tạo 10 câu hỏi (Cấp độ: ${selectedLevel})`;
            });
        });

        generateBtn.addEventListener('click', generateQuiz);

        nextBtn.addEventListener('click', () => {
            if (currentQuestionIndex < quizData.length - 1) {
                currentQuestionIndex++;
                showQuestion(); 
            } else {
                showResultsAnimation(); 
            }
        });

        restartBtn.addEventListener('click', () => {
            // Ẩn kết quả
            resultsContainer.style.opacity = 0;
            resultsContainer.style.transform = 'scale(0.95)';
            resultsContainer.style.pointerEvents = 'none';
            // Ẩn anchor
            anchorBox.style.opacity = 0;
            anchorBox.style.transform = 'scale(0.9)';
            anchorBox.style.pointerEvents = 'none';
            
            setTimeout(() => {
                // Hiện generator
                generatorContainer.style.opacity = 1;
                generatorContainer.style.transform = 'scale(1)';
                generatorContainer.style.pointerEvents = 'auto';
                adjustCardHeight(generatorContainer);

                // Reset trạng thái
                selectedLevel = null;
                levelTabs.forEach(tab => {
                    tab.classList.remove('active-tab');
                    tab.disabled = false;
                });
                generateBtn.disabled = true;
                generateBtnText.textContent = 'Chọn cấp độ để bắt đầu';
                errorMessage.textContent = '';
            }, 300);
        });

        // Xóa các lớp CSS cũ (đã được thay thế bằng JS 'style')
        // Đây là bước dọn dẹp để tránh xung đột
        document.querySelectorAll('.view-layer').forEach(el => {
            el.classList.remove('opacity-0', 'scale-95', 'pointer-events-none', 'scale-100');
        });
        // Thiết lập trạng thái ban đầu bằng JS
        generatorContainer.style.opacity = 1;
        generatorContainer.style.transform = 'scale(1)';
        generatorContainer.style.pointerEvents = 'auto';

        quizContainer.style.opacity = 0;
        quizContainer.style.transform = 'scale(0.95)';
        quizContainer.style.pointerEvents = 'none';

        resultsContainer.style.opacity = 0;
        resultsContainer.style.transform = 'scale(0.95)';
        resultsContainer.style.pointerEvents = 'none';

        anchorBox.style.opacity = 0;
        anchorBox.style.transform = 'scale(0.9)';
        anchorBox.style.pointerEvents = 'none';

    }); // <-- Đóng DOMContentLoaded
    </script>
</body>
</html>
